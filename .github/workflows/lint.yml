name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (clippy + fmt + bootstrap tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/crosshook-native/target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('src/crosshook-native/Cargo.lock') }}
          restore-keys: rust-lint-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev dbus

      - name: Check formatting
        run: cargo fmt --manifest-path src/crosshook-native/Cargo.toml --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path src/crosshook-native/Cargo.toml --all-targets -- -D warnings

      - name: Run application and native bootstrap tests
        run: cargo test --manifest-path src/crosshook-native/Cargo.toml -p crosshook-app -p crosshook-native -p crosshook-cli -p crosshook-view-model

      - name: Single-instance D-Bus round trip (private session bus)
        # Without a session bus the test skips; run it on a private bus so the
        # claim and Activate paths are exercised for real.
        run: dbus-run-session -- cargo test --manifest-path src/crosshook-native/Cargo.toml -p crosshook-app --test instance_activation

      - name: UI-free dependency guardrail
        run: |
          ./scripts/check-app-deps.sh --selftest
          ./scripts/check-app-deps.sh

      - name: View-model clippy (default and all features) and tests (all features)
        # Clippy reports clippy.toml entries that do not resolve to a concrete
        # item as plain warnings that `-D warnings` does not promote, so a
        # typo'd or module path would silently disable a ban. Fail on them.
        run: |
          set -euo pipefail
          manifest=src/crosshook-native/Cargo.toml
          log="$(mktemp)"
          for features in "" "--all-features"; do
            # shellcheck disable=SC2086 # $features is empty or one flag
            cargo clippy --manifest-path "$manifest" -p crosshook-view-model $features --all-targets -- -D warnings 2>&1 | tee -a "$log"
          done
          if grep -E 'does not refer to a reachable|found a module|expected a (function|type)' "$log"; then
            echo "error: crosshook-view-model clippy.toml has entries that do not resolve" >&2
            exit 1
          fi
          cargo test --manifest-path "$manifest" -p crosshook-view-model --all-features

      - name: Release build must not enable bootstrap-trace
        run: |
          set -euo pipefail
          tree="$(cargo tree --manifest-path src/crosshook-native/Cargo.toml -e features -p crosshook-native --edges normal)"
          if grep -F 'bootstrap-trace' <<<"$tree"; then
            echo "error: bootstrap-trace is enabled in the release (normal-edge) feature graph" >&2
            exit 1
          fi

  typescript:
    name: TypeScript (biome + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: src/crosshook-native/package-lock.json

      - name: Install dependencies
        working-directory: src/crosshook-native
        run: npm ci

      - name: Biome lint and format check
        working-directory: src/crosshook-native
        run: npx @biomejs/biome ci src/

      - name: TypeScript type check
        working-directory: src/crosshook-native
        run: npm run typecheck

      - name: Run Vitest
        working-directory: src/crosshook-native
        run: npm run test:coverage

  shell:
    name: Shell (shellcheck + host-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh scripts/bench/*.sh scripts/tests/*/*.sh

      - name: Build dependency setup tests
        run: python3 -m unittest scripts/test_build_deps.py

      - name: Bench harness tests
        run: python3 -m unittest scripts/bench/test_bench.py

      - name: Host-gateway guardrail
        run: ./scripts/check-host-gateway.sh

      - name: Host-gateway guardrail self-test
        run: ./scripts/check-host-gateway.sh --self-test

      - name: Check legacy palette
        run: ./scripts/check-legacy-palette.sh

      - name: Check schema-version drift
        run: ./scripts/check-schema-version.sh

      - name: Schema-version check selftest
        run: ./scripts/check-schema-version.sh --selftest

      - name: Startup-path guardrail
        run: ./scripts/check-startup-path.sh

      - name: Startup-path guardrail self-test
        run: ./scripts/check-startup-path.sh --selftest

      - name: Async Tauri commands guardrail
        run: ./scripts/check-async-commands.sh

      - name: Async Tauri commands guardrail self-test
        run: ./scripts/check-async-commands.sh --self-test

      - name: Mock coverage contract gate
        run: ./scripts/check-mock-coverage.sh

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: src/crosshook-native/package-lock.json

      - name: Install dependencies
        working-directory: src/crosshook-native
        run: npm ci

      - name: Install Playwright + browser deps
        working-directory: src/crosshook-native
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        working-directory: src/crosshook-native
        run: npm run test:smoke
