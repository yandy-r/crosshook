[game]
name = "Synthetic Quest"
executable_path = ""

[trainer]
path = ""
type = "FLiNG"
loading_mode = "copy_to_prefix"
trainer_type = "standalone"
required_protontricks = [
    "vcrun2022",
    "dotnet48",
]

[injection]
method = "load_library"
stage = "game_process_ready"
timeout_ms = 5000
fallback = "disable_hook"
dll_paths = [
    "/hooks/overlay.dll",
    'C:\Hooks\helper.dll',
]
inject_on_launch = [
    true,
    false,
]

[[injection.loaded_hooks]]
id = "hook-1"
name = "Overlay"
path = "/hooks/overlay.dll"
enabled = true

[[injection.loaded_hooks]]
id = "loaded-dll-hook-2"
name = "helper.dll"
path = 'C:\Hooks\helper.dll'
enabled = false

[steam]
enabled = false
app_id = ""
compatdata_path = ""
proton_path = ""

[steam.launcher]
icon_path = "/icons/synthetic.png"
display_name = "Synthetic Quest"

[runtime]
prefix_path = ""
proton_path = ""
working_directory = "/games/synthetic-quest"
steam_app_id = "9999001"
umu_game_id = "umu-9999001"
umu_store = "gog"
umu_codename = "Synthetic_Quest"
umu_preference = "umu"

[launch]
method = "proton_run"
network_isolation = false

[launch.optimizations]
enabled_option_ids = [
    "use_gamemode",
    "show_mangohud_overlay",
]

[launch.command_arguments]
enabled_argument_ids = [
    "force_vulkan",
    "skip_launcher",
]
custom_args = [
    "-windowed",
    "+set sv_cheats 1",
]

[launch.presets.Balanced]
enabled_option_ids = ["use_gamemode"]

[launch.custom_env_vars]
DXVK_HUD = "fps,devinfo"
PROTON_LOG = "1"

[launch.gamescope]
enabled = true
internal_width = 1920
internal_height = 1080
output_width = 2560
output_height = 1440
frame_rate_limit = 60
fsr_sharpness = 5
upscale_filter = "fsr"
fullscreen = true
borderless = false
grab_cursor = true
force_grab_cursor = false
hdr_enabled = false
allow_nested = false
extra_args = ["--mangoapp"]

[launch.trainer_gamescope]
enabled = true
internal_width = 800
internal_height = 600
fullscreen = false
borderless = false
grab_cursor = false
force_grab_cursor = false
hdr_enabled = false
allow_nested = true

[launch.mangohud]
enabled = true
fps_limit = 120
gpu_stats = true
cpu_stats = true
ram = false
frametime = true
battery = false
watt = false
position = "top-left"

[local_override.game]
executable_path = "/games/synthetic-quest/game.exe"
custom_cover_art_path = "/art/cover.png"
custom_portrait_art_path = "/art/portrait.png"
custom_background_art_path = "/art/bg.png"

[local_override.trainer]
path = "/trainers/synthetic-trainer.exe"

[local_override.steam]
compatdata_path = ""
proton_path = ""

[local_override.runtime]
prefix_path = "/prefixes/synthetic-quest"
proton_path = "/compat/GE-Proton9-20"

[[pre_launch_hooks]]
id = "pre-1"
name = "Prepare saves"
path = "/scripts/pre.sh"
stage = "pre-launch"
enabled = true

[[post_exit_hooks]]
id = "post-1"
name = "Backup saves"
path = "/scripts/post.sh"
stage = "post-exit"
enabled = false
