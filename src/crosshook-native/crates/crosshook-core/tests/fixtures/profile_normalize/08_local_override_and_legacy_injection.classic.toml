[game]
name = "Legacy Injection Game"
executable_path = ""

[trainer]
path = ""
type = ""
loading_mode = "source_directory"
required_protontricks = ["d3dx9"]

[injection]
method = "manual_map"
stage = "manual"
timeout_ms = 2500
fallback = "abort_launch"
dll_paths = [
    "/mods/first.dll",
    'C:\Mods\second.dll',
]
inject_on_launch = [
    true,
    false,
]

[[injection.loaded_hooks]]
id = "legacy-dll-hook-1"
name = "first.dll"
path = "/mods/first.dll"
enabled = true

[[injection.loaded_hooks]]
id = "legacy-dll-hook-2"
name = "second.dll"
path = 'C:\Mods\second.dll'
enabled = false

[steam]
enabled = false
app_id = ""
compatdata_path = ""
proton_path = ""

[steam.launcher]
icon_path = ""
display_name = "Legacy Injection Game"

[launch]
method = "proton_run"

[local_override.game]
executable_path = "/local/machine/game.exe"
custom_cover_art_path = ""
custom_portrait_art_path = ""
custom_background_art_path = ""

[local_override.trainer]
path = "/local/machine/trainer.exe"
extra_protontricks = ["d3dx9"]

[local_override.steam]
compatdata_path = ""
proton_path = ""

[local_override.runtime]
prefix_path = "/local/machine/pfx"
proton_path = "/local/machine/proton"
