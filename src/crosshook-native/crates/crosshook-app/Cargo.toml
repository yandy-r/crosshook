[package]

name = "crosshook-app"
version.workspace = true
edition = "2021"
description = "Application layer: runtime owner handle, bounded event bus, sanitized presenter errors, and toolkit-independent services."

[lints]

workspace = true

[dependencies]

crosshook-core = { path = "../crosshook-core" }
nix = { version = "0.31.2", default-features = false, features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
static_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

flate2 = "1"
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt", "io-util"] }
toml = "1.1.0"
