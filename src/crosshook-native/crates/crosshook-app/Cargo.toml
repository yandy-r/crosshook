[package]

name = "crosshook-app"
version.workspace = true
edition = "2021"
description = "Application layer: runtime owner handle, bounded event bus, sanitized presenter errors, and toolkit-independent services."

[lints]

workspace = true

[features]
test-seams = ["crosshook-core/bootstrap-trace"]

[dependencies]

chrono = "0.4"
crosshook-core = { path = "../crosshook-core" }
nix = { version = "0.31.2", default-features = false, features = ["process", "signal", "user"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
static_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
toml = "1.1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
crosshook-app = { path = ".", features = ["test-seams"] }

flate2 = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt", "io-util"] }

[[test]]
name = "bootstrap_ordering"
harness = false

[[test]]
name = "profile_writer_golden"
harness = false

[[test]]
name = "launcher_export_golden"
harness = false
