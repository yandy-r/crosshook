# crosshook-view-model is pure: no I/O, processes, threads, clocks, environment
# or async runtime. Clippy does not match module paths or globs (`std::fs`,
# `tokio::*`); an entry that does not resolve to a concrete item only emits a
# non-fatal warning that `-D warnings` does not promote, so every entry names a
# concrete item and CI (`.github/workflows/lint.yml`) fails on that warning.
# tokio entries are inert while tokio is not a dependency; the tokio guard is
# `scripts/check-app-deps.sh`.
disallowed-methods = [
  { path = "std::thread::sleep", reason = "view-models are pure; time arrives as intent data" },
  { path = "std::thread::spawn", reason = "the UI bridge owns concurrency" },
  { path = "std::thread::scope", reason = "the UI bridge owns concurrency" },
  { path = "std::fs::read", reason = "no I/O in view-models" },
  { path = "std::fs::read_to_string", reason = "no I/O in view-models" },
  { path = "std::fs::read_dir", reason = "no I/O in view-models" },
  { path = "std::fs::write", reason = "no I/O in view-models" },
  { path = "std::fs::create_dir", reason = "no I/O in view-models" },
  { path = "std::fs::create_dir_all", reason = "no I/O in view-models" },
  { path = "std::fs::remove_file", reason = "no I/O in view-models" },
  { path = "std::fs::remove_dir", reason = "no I/O in view-models" },
  { path = "std::fs::remove_dir_all", reason = "no I/O in view-models" },
  { path = "std::fs::rename", reason = "no I/O in view-models" },
  { path = "std::fs::copy", reason = "no I/O in view-models" },
  { path = "std::fs::metadata", reason = "no I/O in view-models" },
  { path = "std::fs::symlink_metadata", reason = "no I/O in view-models" },
  { path = "std::fs::canonicalize", reason = "no I/O in view-models" },
  { path = "std::fs::hard_link", reason = "no I/O in view-models" },
  { path = "std::fs::set_permissions", reason = "no I/O in view-models" },
  { path = "std::fs::exists", reason = "no I/O in view-models" },
  { path = "std::fs::read_link", reason = "no I/O in view-models" },
  { path = "std::path::Path::exists", reason = "no I/O in view-models" },
  { path = "std::path::Path::is_file", reason = "no I/O in view-models" },
  { path = "std::path::Path::is_dir", reason = "no I/O in view-models" },
  { path = "std::path::Path::metadata", reason = "no I/O in view-models" },
  { path = "std::path::Path::canonicalize", reason = "no I/O in view-models" },
  { path = "std::path::Path::read_dir", reason = "no I/O in view-models" },
  { path = "std::path::Path::try_exists", reason = "no I/O in view-models" },
  { path = "std::path::Path::is_symlink", reason = "no I/O in view-models" },
  { path = "std::path::Path::symlink_metadata", reason = "no I/O in view-models" },
  { path = "std::path::Path::read_link", reason = "no I/O in view-models" },
  { path = "std::process::exit", reason = "no process control in view-models" },
  { path = "std::process::abort", reason = "no process control in view-models" },
  { path = "std::env::var", reason = "no environment reads in view-models" },
  { path = "std::env::var_os", reason = "no environment reads in view-models" },
  { path = "std::env::vars", reason = "no environment reads in view-models" },
  { path = "std::env::home_dir", reason = "no environment reads in view-models" },
  { path = "std::env::vars_os", reason = "no environment reads in view-models" },
  { path = "std::env::current_dir", reason = "no environment reads in view-models" },
  { path = "std::env::args", reason = "no environment reads in view-models" },
  { path = "std::env::args_os", reason = "no environment reads in view-models" },
  { path = "std::env::temp_dir", reason = "no environment reads in view-models" },
  { path = "std::env::set_current_dir", reason = "no environment writes in view-models" },
  { path = "std::env::set_var", reason = "no environment writes in view-models" },
  { path = "std::env::remove_var", reason = "no environment writes in view-models" },
  { path = "std::time::SystemTime::now", reason = "no clocks; pass time in intents" },
  { path = "std::time::Instant::now", reason = "no clocks; pass time in intents" },
  { path = "std::time::Instant::elapsed", reason = "no clocks; pass time in intents" },
  { path = "std::time::SystemTime::elapsed", reason = "no clocks; pass time in intents" },
  { path = "std::io::stdin", reason = "no console I/O in view-models" },
  { path = "std::io::stdout", reason = "no console I/O in view-models" },
  { path = "std::io::stderr", reason = "no console I/O in view-models" },
  { path = "tokio::spawn", reason = "no async runtime in view-models" },
  { path = "tokio::task::spawn_blocking", reason = "no async runtime in view-models" },
  { path = "tokio::time::sleep", reason = "no async runtime in view-models" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "no I/O in view-models" },
  { path = "std::fs::OpenOptions", reason = "no I/O in view-models" },
  { path = "std::fs::DirBuilder", reason = "no I/O in view-models" },
  { path = "std::process::Command", reason = "no processes in view-models" },
  { path = "std::process::Child", reason = "no processes in view-models" },
  { path = "std::net::TcpStream", reason = "no network in view-models" },
  { path = "std::net::TcpListener", reason = "no network in view-models" },
  { path = "std::net::UdpSocket", reason = "no network in view-models" },
  { path = "std::os::unix::net::UnixStream", reason = "no IPC sockets in view-models" },
  { path = "std::os::unix::net::UnixListener", reason = "no IPC sockets in view-models" },
  { path = "std::os::unix::net::UnixDatagram", reason = "no IPC sockets in view-models" },
  { path = "std::thread::Builder", reason = "the UI bridge owns concurrency" },
  { path = "tokio::runtime::Runtime", reason = "no async runtime in view-models" },
  { path = "tokio::runtime::Handle", reason = "no async runtime in view-models" },
  { path = "tokio::process::Command", reason = "no async runtime in view-models" },
]
