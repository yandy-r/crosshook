[package]
name = "crosshook-native"
version = "0.6.1"
edition = "2021"
build = "build.rs"

[lib]
name = "crosshook_native"
path = "src/lib.rs"

[[bin]]
name = "crosshook-native"
path = "src/main.rs"

[dependencies]
crosshook-app = { path = "../crates/crosshook-app" }
crosshook-core = { path = "../crates/crosshook-core" }
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["signal", "sync"] }
tracing = "0.1"
nix = { version = "0.31.2", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
crosshook-app = { path = "../crates/crosshook-app", features = ["test-seams"] }
